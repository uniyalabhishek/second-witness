<title>Popup states</title>

<style>
/* Popup. Lift everything except .mock-* */
.popup { width: 360px; max-height: 560px; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); }
.popup-host { padding: var(--space-2) var(--space-3); color: var(--ink-2); overflow-wrap: anywhere; }
.popup .result:not([data-result="changed"]) { padding-top: 0; }
.popup-idle { display: grid; gap: var(--space-3); padding: var(--space-2) var(--space-3) var(--space-3); }
.popup-primary { width: 100%; }
.popup-checking { display: grid; gap: var(--space-1); padding: var(--space-4) var(--space-3); }
.popup-count { font-size: var(--text-l); font-weight: var(--weight-strong); line-height: var(--leading-tight); }
.popup-rows { padding: 0 var(--space-3); }
.popup-rows--gap { margin-top: var(--space-2); }
.popup-list { padding: var(--space-2) var(--space-3) 0; }
.popup-list--first .list > li { font-weight: var(--weight-strong); }
.popup-list--first .value { font-weight: var(--weight-strong); }
.popup-region { margin: var(--space-1) var(--space-3) 0; max-height: 96px; overflow-y: auto; flex: none; }
.popup-note { padding: var(--space-2) var(--space-3) 0; }
.popup-foot { position: sticky; bottom: 0; margin-top: var(--space-3); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-top: var(--rule-width) solid var(--rule); background: var(--bg); }
.popup-last { padding: 0 var(--space-3) var(--space-3); }

/* Mock page only */
.mock-page { padding: var(--space-3); display: grid; gap: var(--space-4); justify-items: start; }
.mock-state { display: grid; gap: var(--space-1); }
.mock-caption { font-size: var(--text-s); color: var(--ink-2); }
.mock-state .popup { outline: var(--rule-width) solid var(--rule-strong); }
</style>
</head>

<script>
/* Mock only: theme switch. Open with #dark or #light to force a theme. */
var t=location.hash.slice(1);if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;
var b=document.querySelector('[data-theme-toggle]');
if(b)b.addEventListener('click',function(){var d=document.documentElement,n=(d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark'?'light':'dark';d.dataset.theme=n;});
/* Ship this part: click copies the whole value, focus reveals it in place. */
document.addEventListener('click',function(e){var v=e.target.closest('[data-copy]');if(!v)return;navigator.clipboard&&navigator.clipboard.writeText(v.dataset.copy);v.dataset.copied='';setTimeout(function(){delete v.dataset.copied},1500);});
</script>
